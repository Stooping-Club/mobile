name: Build iOS Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild iOS
        run: bunx expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build release archive
        run: |
          xcodebuild archive \
            -workspace ios/scmobile.xcworkspace \
            -scheme scmobile \
            -configuration Release \
            -archivePath ${{ runner.temp }}/scmobile.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Export unsigned app
        run: |
          mkdir -p artifacts
          cp -r ${{ runner.temp }}/scmobile.xcarchive/Products/Applications/scmobile.app artifacts/ 2>/dev/null || \
          cp -r ${{ runner.temp }}/scmobile.xcarchive artifacts/

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: scmobile.xcarchive
          path: artifacts/
