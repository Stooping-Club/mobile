name: Build Android Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild Android
        run: bunx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.EXPO_PUBLIC_SHOPIFY_STORE_DOMAIN }}
          EXPO_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.EXPO_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
